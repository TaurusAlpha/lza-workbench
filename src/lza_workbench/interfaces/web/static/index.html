<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LZA Workbench</title>
    <link rel="stylesheet" href="/css/app.css">
  </head>
  <body>
    <main class="shell">
      <header class="page-header">
        <div class="header-content">
          <nav id="breadcrumb" class="breadcrumb-bar" aria-label="Breadcrumb" hidden>
            <a href="#/overview" class="breadcrumb-back-link">
              <svg class="breadcrumb-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
              <span>Back to Overview</span>
            </a>
          </nav>
          <p id="page-eyebrow" class="eyebrow">LZA Workbench</p>
          <h1 id="page-title" class="page-title">Workspace Overview</h1>
          <p id="workspace-path" class="workspace-path" title="Loading workspace status…">Loading workspace status…</p>
        </div>
        <div class="header-actions">
          <button id="refresh" class="btn" type="button">
            <svg class="btn-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
            </svg>
            <span>Refresh</span>
          </button>
        </div>
      </header>
      <section id="notice" aria-live="polite"></section>
      <section id="view-content" class="card-grid" aria-busy="true"></section>
    </main>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
