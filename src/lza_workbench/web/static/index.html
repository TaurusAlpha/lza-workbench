<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LZA Workbench</title>
    <link rel="stylesheet" href="/css/app.css">
  </head>
  <body>
    <main class="shell">
      <header class="page-header">
        <div>
          <p class="eyebrow">LZA Workbench</p>
          <h1>Workspace Overview</h1>
          <p id="workspace-path" class="muted">Loading workspace status…</p>
        </div>
        <button id="refresh" type="button">Refresh</button>
      </header>
      <section id="notice" aria-live="polite"></section>
      <section id="overview" class="card-grid" aria-busy="true"></section>
    </main>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
