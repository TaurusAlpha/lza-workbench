schema_version: 2

customer:
  name: Comm-IT Test
  slug: comm-it-test

aws:
  profile: comm-it-root
  region: eu-west-1
  account_id: '123456789012'

lza:
  version: v1.15.5
  accelerator_prefix: AWSAccelerator

installer:
  local_path: aws-accelerator-installer
  stack_name: cf-lza-installer
  # CloudFormation template used to deploy or update the LZA installer stack.
  # The official template URL is version-specific.
  stack_template:
    source: amazon # amazon | local | git | s3
    path: https://s3.amazonaws.com/solutions-reference/landing-zone-accelerator-on-aws/v1.15.5/AWSAccelerator-InstallerStack.template

    # Examples for other sources:
    #
    # source: local
    # path: ./templates/AWSAccelerator-InstallerStack.template
    #
    # source: s3
    # path: s3://my-lza-artifacts/v1.15.5/AWSAccelerator-InstallerStack.template
    #
    # source: git
    # repository: https://github.com/example/lza-installer-templates.git
    # ref: main
    # path: templates/AWSAccelerator-InstallerStack.template

  # Source code consumed by the installer pipeline.
  # This is separate from the CloudFormation installer stack template.
  source_code:
    repository_type: github # github | codecommit | s3
    owner: awslabs
    repository_name: landing-zone-accelerator-on-aws
    branch: release/v1.15.5

    # GitHub example:
    # repository_type: github
    # owner: awslabs
    # repository_name: landing-zone-accelerator-on-aws
    # branch: release/v1.15.5
    #
    # CodeCommit example:
    # repository_type: codecommit
    # repository_name: landing-zone-accelerator-on-aws
    # branch: release/v1.15.5
    #
    # S3 example:
    # repository_type: s3
    # bucket: aws-accelerator-installer-123456789012-eu-west-1
    # key: source/v1.15.5.zip
    #
    # CodeConnection example:
    # repository_type: codeconnection
    # connection_arn: arn:aws:codeconnections:eu-west-1:123456789012:connection/example
    # owner: example
    # repository_name: landing-zone-accelerator-on-aws
    # branch: release/v1.15.5

  options:
    enable_approval_stage: false
    enable_diagnostics_pack: false
    anonymous_data: false

    approval_stage_notify_email_list: []
    management_account_email: null
    audit_account_email: null
    log_archive_account_email: null
    control_tower_enabled: true

    use_existing_config_repo: false
    existing_config_repository_name: null
    existing_config_repository_branch_name: null
    existing_config_repository_owner: null
    config_code_connection_arn: null

configuration:
  local_path: aws-accelerator-config

  # Starter configuration copied during `lza init`.
  template:
    source: packaged # packaged | local | git
    name: default

    # Local template example:
    # source: local
    # path: ../lza-templates/customer-default
    #
    # Git template example:
    # source: git
    # repository: https://github.com/example/lza-config-templates.git
    # ref: main
    # path: templates/default

  # Destination used by the LZA configuration pipeline.
  repository:
    type: s3 # s3 | codecommit | codeconnection

    bucket: aws-accelerator-config-123456789012-eu-west-1

    # CodeCommit example:
    # type: codecommit
    # repository_name: aws-accelerator-config
    # branch: main
    #
    # codeconnection example:
    # type: codeconnection
    # codeconnection_arn: arn:aws:codeconnections:eu-west-1:123456789012:connection/example
    # owner: example
    # repository_name: customer-lza-config
    # branch: main
    # The local configuration repository must already have its Git origin configured.

    s3_packaging:
      exclude:
        directories:
          - .git
        files:
          - .DS_Store

pipelines:
  installer:
    name: AWSAccelerator-InstallerStack

  configuration:
    name: AWSAccelerator-Pipeline
    watch: true
    execute: true
    detailed_error_reporting: false
    poll_interval_seconds: 30

cli_defaults:
  debug: false
  dry_run: false
