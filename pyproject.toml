[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "lza-workbench"
version = "0.38.2"

description = "Toolkit for initializing and managing AWS Landing Zone Accelerator workspaces"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "boto3>=1.40.0",
  "fastapi>=0.115.0",
  "pydantic>=2.11.0",
  "rich>=14.0.0",
  "ruamel.yaml>=0.18.0",
  "typer>=0.16.0",
  "uvicorn>=0.30.0",
]

[project.scripts]
lza = "lza_workbench.cli:main"
lza-workbench = "lza_workbench.cli:main"

[dependency-groups]
dev = [
  "httpx2>=0.1.0",
  "pytest>=8.4.0",
  "ruff>=0.12.0",
  "complexipy>=8.0.1",
  "import-linter>=2.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
extend-select = ["C901"]

[tool.ruff.lint.mccabe]
# Standard thresholds: 10 (strict), 15 (moderate)
max-complexity = 15

[tool.complexipy]
paths = ["src"]
max-complexity-allowed = 15
exclude = ["tests/*"]

[tool.importlinter]
root_packages = ["lza_workbench"]

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
  "lza_workbench.cli | lza_workbench.web",
  "lza_workbench.workflows",
  "lza_workbench.configuration : lza_workbench.installer : lza_workbench.pipeline : lza_workbench.workspace",
  "lza_workbench.aws",
]
ignore_imports = [
  "lza_workbench.cli.main -> lza_workbench.web.main",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "unit: deterministic component behavior with mocked external boundaries",
  "workflow: local workspace, state, archive, and service-orchestration behavior",
  "cli: command parsing, prompts, rendering, and exit-status behavior",
  "git: tests that execute local Git commands against temporary repositories",
  "arch: static architectural and dependency-boundary invariants",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lza_workbench"]
